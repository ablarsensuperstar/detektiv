<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2236">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Detektiv Camille">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Detektiv Camille</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: ét smalt spor (max 560px) som en detektivs notesbog. Sagsmapper som kartotekskort med messingfane, opgaver på en linjeret side. Større skrift end storesøsterens udgave. */
:root{
  --bg:#eaeef0;
  --paper:#faf8f1;
  --paper2:#f1eee3;
  --ink:#1b2236;
  --muted:#5d6579;
  --line:#cdd3de;
  --rule:#d9d2bf;
  --brass:#a8771f;
  --brass-soft:#f1e4c4;
  --wax:#b8382f;
  --ok:#2f8a4a;
  --ok-soft:#dff2e4;
  --bad:#c23b2f;
  --bad-soft:#f8e0dc;
  --dansk:#b8382f;
  --mat:#1f5fa8;
  --eng:#2f8a4a;
  --gange:#0e8a8a;
  --shadow:0 6px 18px rgba(27,34,54,.12);
  --display:'Special Elite','Courier New',monospace;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111624; --paper:#1b2234; --paper2:#222b40; --ink:#ebe6d8; --muted:#a4aabb; --line:#303a52; --rule:#2c3449;
    --brass:#d3a44c; --brass-soft:#3a3120; --wax:#e0564a; --ok:#5cc07a; --ok-soft:#1d3a28; --bad:#ef6a5e; --bad-soft:#44231f;
    --dansk:#ef6a5e; --mat:#6aa6ec; --eng:#5cc07a; --gange:#4fc9c9; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111624; --paper:#1b2234; --paper2:#222b40; --ink:#ebe6d8; --muted:#a4aabb; --line:#303a52; --rule:#2c3449;
  --brass:#d3a44c; --brass-soft:#3a3120; --wax:#e0564a; --ok:#5cc07a; --ok-soft:#1d3a28; --bad:#ef6a5e; --bad-soft:#44231f;
  --dansk:#ef6a5e; --mat:#6aa6ec; --eng:#5cc07a; --gange:#4fc9c9; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.9rem}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.lnk{color:var(--muted);font-weight:700;padding:8px 4px;border-radius:8px}
.lnk:hover{color:var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{font-family:var(--display);color:var(--brass);letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;display:flex;gap:6px;align-items:center}
.stat b{color:var(--brass);font-variant-numeric:tabular-nums}
.sektion{display:flex;flex-direction:column;gap:10px}
.sektion-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sektion-h span{color:var(--muted);font-size:.9rem;font-weight:700}
.mappe{position:relative;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px 14px 14px 14px;padding:16px 16px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;margin-top:14px}
.mappe::before{content:attr(data-nr);position:absolute;top:-14px;left:14px;background:var(--brass);color:#fff;font-family:var(--display);font-size:.75rem;letter-spacing:.1em;padding:2px 10px;border-radius:6px 6px 0 0}
.mappe h3{grid-column:1}
.mappe .sted{grid-column:1;color:var(--muted);font-size:.9rem}
.mappe .status{grid-column:2;grid-row:1/3;font-weight:800;font-size:.85rem;padding:6px 10px;border-radius:999px;background:var(--paper2);color:var(--muted);white-space:nowrap}
.mappe.done .status{background:var(--ok-soft);color:var(--ok)}
.mappe.igang .status{background:var(--brass-soft);color:var(--brass)}
.mappe:hover{transform:translateY(-1px)}
.stjerner{color:var(--brass);letter-spacing:.05em}
.fagrad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fagknap{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--f);border-radius:12px;padding:14px 10px;font-weight:800;box-shadow:var(--shadow)}
.fagknap small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.gangeknap{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--gange);border-radius:12px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.gangeknap small{display:block;color:var(--muted);font-weight:600;font-size:.85rem}
.prog{display:flex;gap:6px;align-items:center}
.prog i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.prog i.d{background:var(--brass);border-color:var(--brass)}
.prog i.n{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.fag{align-self:flex-start;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--f);padding:4px 12px;border-radius:999px}
.side{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 18px;border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.qtext{font-size:1.35rem;font-weight:700;line-height:1.45}
.qtext .tekst{display:block;font-weight:600;font-size:1.1rem;color:var(--muted);margin-bottom:10px;padding:10px 12px;background:var(--paper2);border-radius:8px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--paper2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;font-size:1.1rem;min-height:56px;display:flex;align-items:center;gap:12px;transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .b{width:30px;height:30px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem;flex:none;font-family:var(--display)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);opacity:.7}
.opt:disabled{cursor:default}
.ans{display:flex;gap:10px}
.ans input{flex:1;min-width:0;font:inherit;font-size:1.5rem;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper2);color:var(--ink);font-variant-numeric:tabular-nums}
.ans input.ok{border-color:var(--ok)}
.ans input.bad{border-color:var(--bad)}
.knap{background:var(--ink);color:var(--bg);font-weight:800;padding:12px 20px;border-radius:12px;min-height:48px}
.knap.brass{background:var(--brass);color:#fff}
.knap.lys{background:var(--paper2);color:var(--ink);border:1px solid var(--line)}
.knap:disabled{opacity:.5;cursor:default}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--paper)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb .t{font-weight:800;font-size:1.1rem}
.fb.ok .t{color:var(--ok)}
.fb.bad .t{color:var(--bad)}
.fb .fork{color:var(--muted);font-size:1rem}
.hist{font-family:var(--display);font-size:1.08rem;line-height:1.55;border-left:3px solid var(--brass);padding-left:12px}
.spor{background:var(--brass-soft);border:1px dashed var(--brass);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.spor .lup{font-family:var(--display);color:var(--brass);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;flex:none;padding-top:3px}
.rad{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.intro{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.intro .sted{font-family:var(--display);color:var(--brass);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.intro p.hist{font-family:var(--body);border:0;padding:0;font-size:1.1rem;line-height:1.6}
.mist{display:grid;gap:10px}
.mistk{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.mistk:hover{border-color:var(--brass)}
.mistk b{font-size:1.1rem}
.mistk .rolle{color:var(--muted);font-size:.95rem}
.traek{display:flex;flex-wrap:wrap;gap:6px}
.traek span{font-size:.9rem;font-weight:700;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.mistk.ude{opacity:.5}
.mistk.ude:hover{border-color:var(--line)}
.sporliste{display:flex;flex-direction:column;gap:8px}
.opk{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.opk .stempel{font-family:var(--display);color:var(--wax);border:3px solid var(--wax);border-radius:8px;padding:6px 16px;font-size:1.4rem;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-4deg)}
.opk .store{font-size:2.2rem;color:var(--brass);letter-spacing:.1em}
.opk p{max-width:46ch}
.score{font-size:3rem;font-family:var(--display);color:var(--brass);font-variant-numeric:tabular-nums}
.tabeller{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px 4px;font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab small{font-weight:700;color:var(--muted);font-size:.72rem}
.tab:hover{border-color:var(--gange)}
.gspil{display:flex;flex-direction:column;gap:14px}
.ur{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.ur .tid{font-family:var(--display);font-size:1.5rem;color:var(--gange)}
.gq{font-size:3rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.gq.ok{color:var(--ok)}
.gq.bad{color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:var(--paper2);border:2px solid var(--line);border-radius:12px;font-size:1.6rem;font-weight:800;min-height:60px;font-variant-numeric:tabular-nums}
.pad button:active{transform:scale(.97)}
.pad button.ok{background:var(--gange);color:#fff;border-color:var(--gange)}
.gsvar{text-align:center;font-size:2rem;font-weight:800;min-height:44px;font-variant-numeric:tabular-nums;color:var(--gange)}
.bar{height:8px;background:var(--paper2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gange);width:0;transition:width .2s}
canvas.konf{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
@media (max-width:420px){.gq{font-size:2.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
'use strict';
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS='detektiv_camille_v1';
const NAVN='Camille';
const FAG={dansk:{navn:'Dansk',farve:'var(--dansk)'},mat:{navn:'Matematik',farve:'var(--mat)'},eng:{navn:'Engelsk',farve:'var(--eng)'}};
const N_SPM=6, SPOR_VED=[1,3,5], N_TRAEN=8, N_JAGT=12;

// ---------- Sagerne (2. klasse: korte sætninger, tre mistænkte) ----------
const SAGER=[
{id:'bamse',titel:'Bamsen Bjørn er væk',sted:'Sommerhuset',
 intro:'Bamsen Bjørn sover altid i Camilles seng. Men i dag er han væk! Hvem har taget ham?',
 labels:{fod:'Fodspor',sted:'Var',ting:'Har'},
 mist:[
  {navn:'Hunden Pelle',rolle:'elsker bløde ting',t:{fod:'poter',sted:'i haven',ting:'mudder på poterne'}},
  {navn:'Morfar Finn Drost',rolle:'læser avis i stuen',t:{fod:'hjemmesko',sted:'i stuen',ting:'avisen'}},
  {navn:'Nabopigen Olivia',rolle:'leger tit i haven',t:{fod:'gummistøvler',sted:'i haven',ting:'en spand'}}],
 spor:[
  {tekst:'Sporet går ud i haven.',n:'sted',v:'i haven'},
  {tekst:'Der er mudder på gulvet.',n:'ting',v:'mudder på poterne'},
  {tekst:'Aftrykkene på gulvet er fra poter.',n:'fod',v:'poter'}],
 skyldig:'Hunden Pelle',
 loesning:'Pelle havde lagt Bjørn i sin hundekurv. Han ville bare sove med ham. Nu har Pelle fået sin egen bamse.',
 hist:['Du tager din lup frem. Nu er du detektiv!','Sengen er tom. Men dynen er krøllet.','Du kigger på gulvet med lommelygten.','Morfar Finn siger: "Jeg har ikke set Bjørn."','Olivia siger: "Jeg har kun leget med min spand."','Du går ud i haven og kigger dig omkring.']},
{id:'jordbaer',titel:'Hvem spiste jordbærrene?',sted:'Haven',
 intro:'Morfar har plukket en stor skål jordbær. Nu er skålen tom! Hvem har spist dem?',
 labels:{spor:'Fingre',sted:'Var',mund:'Om munden'},
 mist:[
  {navn:'Solsorten',rolle:'sidder på taget',t:{spor:'et næb',sted:'på taget',mund:'ingenting'}},
  {navn:'Lillebror Noah',rolle:'elsker jordbær',t:{spor:'små fingre',sted:'i haven',mund:'rød saft'}},
  {navn:'Morfar Finn Drost',rolle:'plukkede jordbærrene',t:{spor:'store fingre',sted:'i køkkenet',mund:'ingenting'}}],
 spor:[
  {tekst:'Nogen var i haven i eftermiddag.',n:'sted',v:'i haven'},
  {tekst:'Der er små fingermærker på skålen.',n:'spor',v:'små fingre'},
  {tekst:'Den skyldige har rød saft om munden.',n:'mund',v:'rød saft'}],

{id:'telt',titel:'Lyden i teltet',sted:'Campingpladsen',
 intro:'Om natten var der en mærkelig lyd uden for teltet. Smask, smask, puf. Hvem var det?',
 labels:{spor:'Fodspor',tid:'Er vågen',mad:'Spiser'},
 mist:[
  {navn:'Pindsvinet',rolle:'bor under hækken',t:{spor:'små poter',tid:'om natten',mad:'kattemad'}},
  {navn:'Katten Mis',rolle:'bor i hus nummer 3',t:{spor:'bløde poter',tid:'om natten',mad:'mælk'}},
  {navn:'Morfar Finn Drost',rolle:'sover tungt i den store campingvogn',t:{spor:'gummistøvler',tid:'om dagen',mad:'lakrids'}}],
 spor:[
  {tekst:'Lyden kom midt om natten.',n:'tid',v:'om natten'},
  {tekst:'Skålen med kattemad er tom.',n:'mad',v:'kattemad'},
  {tekst:'Der er små, spidse aftryk i sandet.',n:'spor',v:'små poter'}],
 skyldig:'Pindsvinet',
 loesning:'Det var pindsvinet! Det havde fundet kattemaden og smaskede højt. Nu får det sin egen lille skål hver aften.',
 hist:['Du kryber ud af teltet. Græsset er vådt.','Du husker, hvornår du hørte lyden.','Der står en skål ved siden af teltet.','Morfar Finn kommer forbi. "Jeg sov hele natten," siger han.','Katten Mis slikker sig om munden. Den har drukket mælk.','Du kigger ned i sandet foran teltet.']},
{id:'is',titel:'Den forsvundne is',sted:'Køkkenet',
 intro:'Der lå tre is i fryseren. Nu er der kun to! Hvem har taget den sidste chokoladeis?',
 labels:{fod:'Fødder',sted:'Var',ting:'Har på sig'},
 mist:[
  {navn:'Morfar Finn Drost',rolle:'elsker chokolade',t:{fod:'store fødder',sted:'på terrassen',ting:'chokolade på skjorten'}},
  {navn:'Kusine Alma',rolle:'elsker jordbær',t:{fod:'store fødder',sted:'i køkkenet',ting:'jordbærsaft på kjolen'}},
  {navn:'Hunden Pelle',rolle:'snuser altid ved fryseren',t:{fod:'poter',sted:'i haven',ting:'ingenting'}}],
 spor:[
  {tekst:'Store fodspor går væk fra fryseren.',n:'fod',v:'store fødder'},
  {tekst:'Der er chokolade på fryserens låge.',n:'ting',v:'chokolade på skjorten'},
  {tekst:'En ispind ligger på terrassen.',n:'sted',v:'på terrassen'}],
 skyldig:'Morfar Finn Drost',
 loesning:'Morfar Finn blev helt rød i hovedet. "Jeg var så varm!" sagde han. Han købte nye is til alle.',
 hist:['Fryseren står på klem. Der drypper lidt på gulvet.','Du kigger på gulvet foran fryseren.','Alma siger: "Jeg kan ikke lide chokolade."','Pelle logrer. Han har ingen is.','Du kigger nøje på lågen til fryseren.','Du går ud for at lede efter flere spor.']},
{id:'kat',titel:'Hvor er katten Misse?',sted:'Sommerhuset og haven',titelD:'Hvor er Misse?',erSted:true,
 intro:'Katten Misse plejer at komme, når man rasler med maden. Men i dag kommer hun ikke. Hvor er hun?',
 labels:{lyd:'Lyd',ting:'Der er',doer:'Døren'},
 mist:[
  {navn:'I skuret',rolle:'det gamle skur i haven',t:{lyd:'et svagt mjav',ting:'gamle fiskenet',doer:'står på klem'}},
  {navn:'Under sengen',rolle:'i det lille værelse',t:{lyd:'et svagt mjav',ting:'støv og sokker',doer:'er åben'}},
  {navn:'Oppe i træet',rolle:'det store æbletræ',t:{lyd:'fuglekvidder',ting:'blade og æbler',doer:'ingen dør'}}],
 spor:[
  {tekst:'Du hører et svagt mjav et sted.',n:'lyd',v:'et svagt mjav'},
  {tekst:'Der ligger kattehår ved en dør, som står på klem.',n:'doer',v:'står på klem'},
  {tekst:'Det lugter af fisk derinde.',n:'ting',v:'gamle fiskenet'}],
 skyldig:'I skuret',
 loesning:'Misse sad i skuret oven på de gamle fiskenet. Døren var smækket i bag hende. Hun fik en ekstra portion mad.',
 hist:['Du rasler med maden igen. Ingen kat.','Du står helt stille og lytter.','Du kigger under sengen. Kun støv og en sok.','Du kigger op i træet. Kun fugle.','Morfar Finn siger: "Katte gemmer sig altid, hvor det lugter af fisk."','Du går hen mod skuret og snuser.']},
{id:'bolle',titel:'Den sidste bolle',sted:'Morgenbordet på terrassen',
 intro:'Der var én bolle tilbage på fadet. Camille skulle have den. Men nu er den væk!',
 labels:{spor:'Spor',sted:'Var',ting:'Taber'},
 mist:[
  {navn:'Mågen Max',rolle:'skriger altid efter mad',t:{spor:'vinger',sted:'på terrassen',ting:'hvide fjer'}},
  {navn:'Morfar Finn Drost',rolle:'elsker boller med ost',t:{spor:'hænder',sted:'på terrassen',ting:'krummer'}},
  {navn:'Hunden Pelle',rolle:'elsker boller',t:{spor:'poter',sted:'under bordet',ting:'hundehår'}}],
 spor:[
  {tekst:'Krummerne fører ud på terrassen.',n:'sted',v:'på terrassen'},
  {tekst:'Der ligger en hvid fjer ved krummerne.',n:'ting',v:'hvide fjer'},
  {tekst:'Nogen fløj væk, da vi kom.',n:'spor',v:'vinger'}],

let P;
function load(){try{P=JSON.parse(localStorage.getItem(LS))||{}}catch(e){P={}}
  P.sager=P.sager||{};P.set=P.set||{dansk:[],eng:[]};P.rigtige=P.rigtige||0;P.spm=P.spm||0;P.gange=P.gange||{};P.dage=P.dage||[];}
function save(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function noterDag(){const d=new Date().toISOString().slice(0,10);if(!P.dage.includes(d)){P.dage.push(d);save()}}
function pickItem(fag){
  const bank=fag==='dansk'?DANSK:ENGELSK;let seen=P.set[fag];
  let kand=bank.map((_,i)=>i).filter(i=>!seen.includes(i));
  if(!kand.length){seen=P.set[fag]=[];kand=bank.map((_,i)=>i)}
  const i=pick(kand);seen.push(i);save();
  const it=bank[i];return{type:'mc',q:it.q,t:it.t,svar:it.o[0],opts:shuffle(it.o),f:it.f};
}
function lavMat(){const it=pick(MAT)();
  if(it.mc)return{type:'mc',q:it.q,svar:it.o[0],opts:shuffle(it.o),f:it.f};
  return{type:'tal',q:it.q,svar:String(it.s),f:it.f};}
function lavSpm(fag){return fag==='mat'?lavMat():pickItem(fag)}

  <header class="top"><button class="lnk" data-go="hjem">← Sager</button></header>
  <div class="intro"><div class="sted">${esc(s.titel)}</div><h2>${esc(s.titelD||'Hvem var det?')}</h2>
   <div class="sporliste">${s.spor.map(sp=>`<div class="spor"><span class="lup">Ledetråd</span><span>${esc(sp.tekst)}</span></div>`).join('')}</div>
   <p>Kig på ledetrådene. Tryk på ${s.erSted?'det sted, du tror, hun er':'den, du tror, det var'}.</p></div>
  <div class="mist">${s.mist.map((m,i)=>{const ude=S.ude.includes(i);
    return `<button class="mistk ${ude?'ude':''}" data-mist="${i}" ${ude?'disabled':''}><b>${esc(m.navn)}</b><span class="rolle">${esc(m.rolle)}</span>
     <div class="traek">${Object.entries(m.t).map(([k,v])=>`<span>${esc(s.labels[k])}: ${esc(v)}</span>`).join('')}</div></button>`}).join('')}</div>
  <div id="fb"></div>`;}
function rOpklaret(){const s=S.sag,p=P.sager[s.id];return `
  <div class="opk"><div class="stempel">Løst</div><h2>${esc(s.titel)}</h2>
   <div class="store">${stjerner(p.stars)}</div>
   <p><b>${s.erSted?`Hun var ${esc(s.skyldig.toLowerCase())}!`:`Det var ${esc(s.skyldig)}!`}</b></p><p>${esc(s.loesning)}</p>
   <p style="color:var(--muted)">${S.fejl===0?'Ingen fejl. Du er en superdetektiv!':S.fejl===1?'Kun én fejl. Flot!':`${S.fejl} fejl. Men sagen er løst!`}</p>
   <div class="rad"><button class="knap brass" data-go="hjem">Tilbage til sagerne</button></div></div>`;}
function rTraenSlut(){const f=FAG[S.fag];const r=S.qs.length-S.fejl;return `
  <div class="opk"><span class="fag" style="--f:${f.farve};align-self:center">${f.navn}</span><h2>Træning færdig</h2>
   <div class="score">${r} / ${S.qs.length}</div>
   <p>${r===S.qs.length?'Alle rigtige! Fantastisk!':r>=S.qs.length-2?'Godt gået!':'Godt kæmpet. Prøv igen!'}</p>
   <div class="rad"><button class="knap lys" data-go="hjem">Hjem</button><button class="knap brass" data-traen="${S.fag}">Igen</button></div></div>`;}

// ---------- Opgave-flow ----------
function startSag(id){const sag=SAGER.find(s=>s.id===id);noterDag();
  P.sager[id]=P.sager[id]||{};P.sager[id].igang=true;save();
  const fag=shuffle(['mat','mat','mat','dansk','dansk','eng']);
  S={screen:'q',mode:'sag',sag,qs:fag,i:0,fejl:0,forsog:0};nyt();}
function startTraen(fag){noterDag();S={screen:'q',mode:'traen',fag,qs:Array(N_TRAEN).fill(fag),i:0,fejl:0,forsog:0};nyt();}
function nyt(){S.fag=S.qs[S.i];S.item=lavSpm(S.fag);S.forsog=0;S.screen='q';render();const inp=document.getElementById('ans');if(inp)inp.focus();}
function norm(v){return String(v).trim().toLowerCase().replace(/\s+/g,'').replace(/\./g,'').replace(',','.')}
function tjek(svar){const it=S.item;const rigtigt=norm(svar)===norm(it.svar);
  P.spm++;if(rigtigt&&S.forsog===0)P.rigtige++;save();
  if(rigtigt){vis(true,svar);return}
  S.forsog++;if(S.forsog===1){S.fejl++;visPrøvIgen(svar)}else vis(false,svar);}
function visPrøvIgen(svar){const fb=document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.opt===svar){b.classList.add('bad');b.disabled=true}});
  const inp=document.getElementById('ans');if(inp){inp.classList.add('bad');inp.select()}
  fb.innerHTML=`<div class="fb bad"><div class="t">Ikke helt. Prøv én gang til!</div></div>`;}
function vis(rigtigt,svar){const it=S.item,fb=document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.opt===it.svar)b.classList.add('ok');else if(b.dataset.opt===svar&&!rigtigt)b.classList.add('bad')});
  const inp=document.getElementById('ans');if(inp){inp.disabled=true;inp.classList.add(rigtigt?'ok':'bad');document.querySelector('#ansform button').disabled=true}
  let h='';
  if(rigtigt)h+=`<div class="t">${pick(['Rigtigt!','Flot!','Ja!','Godt set, detektiv!','Super!'])}</div>`;
  else h+=`<div class="t">Det rigtige svar er: ${esc(it.svar)}</div>`;
  if(it.f)h+=`<div class="fork">${esc(it.f)}</div>`;
  const sidste=S.i===S.qs.length-1;
  if(S.mode==='sag'){h+=`<p class="hist">${esc(S.sag.hist[S.i])}</p>`;
    const k=SPOR_VED.indexOf(S.i);if(k>=0)h+=`<div class="spor"><span class="lup">Ledetråd ${k+1}</span><span>${esc(S.sag.spor[k].tekst)}</span></div>`;}
  h+=`<div class="rad"><button class="knap brass" id="naeste">${sidste?(S.mode==='sag'?'Løs sagen →':'Se resultat →'):'Næste →'}</button></div>`;
  fb.innerHTML=`<div class="fb ${rigtigt?'ok':'bad'}">${h}</div>`;
  const b=document.getElementById('naeste');b.focus();b.scrollIntoView({block:'nearest',behavior:'smooth'});}
function naeste(){S.i++;
  if(S.i<S.qs.length){nyt();return}
  if(S.mode==='sag'){S.screen='deduk';S.ude=[];render()}else{S.screen='traenslut';render()}}
function anklag(i){const s=S.sag,m=s.mist[i];
  if(m.navn===s.skyldig){const stars=S.fejl<=1?3:(S.fejl<=2?2:1);const p=P.sager[s.id];
    p.done=true;p.igang=false;p.stars=Math.max(p.stars||0,stars);save();S.screen='opklaret';render();konfetti();return}
  const sp=s.spor.find(x=>m.t[x.n]!==x.v);S.ude.push(i);
  render();document.getElementById('fb').innerHTML=`<div class="fb bad"><div class="t">Nej, ${s.erSted?'hun er ikke '+esc(m.navn.toLowerCase()):'det var ikke '+esc(m.navn)}.</div>
   <div class="fork">${esc(s.labels[sp.n])}: ${esc(m.t[sp.n])}. Men ledetråden siger: "${esc(sp.tekst)}"</div></div>`;
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});}

// ---------- Regnejagten ----------
const JAGTER=[{id:'plus',navn:'Plus til 20',kort:'Plus'},{id:'minus',navn:'Minus til 20',kort:'Minus'},{id:'2',navn:'2-tabellen',kort:'2 ·'},{id:'5',navn:'5-tabellen',kort:'5 ·'},{id:'10',navn:'10-tabellen',kort:'10 ·'},{id:'bland',navn:'Blandet',kort:'Alt'}];
const jagtNavn=id=>JAGTER.find(j=>j.id===id).navn;
function rGangeValg(){return `
  <header class="top"><button class="lnk" data-go="hjem">← Hjem</button></header>
  <div class="intro" style="border-left:6px solid var(--gange)"><h2>Regnejagten</h2><p>Vælg en jagt. Du får ${N_JAGT} regnestykker, og uret kører. Slå din egen bedste tid!</p></div>
  <div class="tabeller">${JAGTER.map(j=>{const b=P.gange[j.id];return `<button class="tab" data-tab="${j.id}">${j.navn}<small>${b?`bedst ${fmt(b.ms)} · ${b.fejl} fejl`:'ny'}</small></button>`}).join('')}</div>`;}
function fmt(ms){const s=Math.round(ms/100)/10;return s.toFixed(1).replace('.',',')+' s'}
function lavStykke(id){
  if(id==='bland')id=pick(['plus','minus','2','5','10']);
  if(id==='plus'){const a=rnd(1,15),b=rnd(1,20-a);return{a,b,op:'+',s:a+b}}
  if(id==='minus'){const a=rnd(3,20),b=rnd(1,a-1);return{a,b,op:'−',s:a-b}}
  const t=+id,b=rnd(1,10);return Math.random()<.5?{a:t,b,op:'·',s:t*b}:{a:b,b:t,op:'·',s:t*b};}
let gTimer=null;
function startGange(tab){noterDag();const qs=Array.from({length:N_JAGT},()=>lavStykke(tab));
  S={screen:'gange',tab,qs,i:0,fejl:0,inp:'',start:Date.now(),laast:false};render();
  clearInterval(gTimer);gTimer=setInterval(()=>{const e=document.getElementById('tid');if(e)e.textContent=fmt(Date.now()-S.start);else clearInterval(gTimer)},100);}
function rGange(){const q=S.qs[S.i];return `
  <header class="top"><button class="lnk" data-go="gangevalg">← Afbryd</button><div class="ur"><span class="tid" id="tid">${fmt(Date.now()-S.start)}</span></div></header>
  <div class="side gspil" style="background-image:none">
   <div class="ur"><span>${jagtNavn(S.tab)}</span><span>${S.i+1} / ${S.qs.length} · ${S.fejl} fejl</span></div>
   <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
   <div class="gq" id="gq">${q.a} ${q.op} ${q.b} = ?</div>
   <div class="gsvar" id="gsvar">${S.inp||'&nbsp;'}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button data-d="slet">⌫</button><button data-d="0">0</button><button data-d="ok" class="ok">OK</button></div>
  </div>`;}
function gTast(d){if(S.laast)return;
  if(d==='slet')S.inp=S.inp.slice(0,-1);else if(d==='ok')return gTjek();else if(S.inp.length<3)S.inp+=d;
  document.getElementById('gsvar').innerHTML=S.inp||'&nbsp;';
  const q=S.qs[S.i];if(S.inp.length&&+S.inp===q.s&&String(q.s).length===S.inp.length)gTjek();}
function gTjek(){if(!S.inp)return;const q=S.qs[S.i];const ok=+S.inp===q.s;const gq=document.getElementById('gq');
  S.laast=true;gq.textContent=`${q.a} ${q.op} ${q.b} = ${q.s}`;
  if(ok){gq.classList.add('ok');setTimeout(()=>{S.i++;S.inp='';S.laast=false;if(S.i>=S.qs.length)gSlut();else render()},350)}
  else{S.fejl++;gq.classList.add('bad');document.getElementById('gsvar').textContent=S.inp+' ✗';
    setTimeout(()=>{S.i++;S.inp='';S.laast=false;if(S.i>=S.qs.length)gSlut();else render()},1400)}}
function gSlut(){clearInterval(gTimer);const ms=Date.now()-S.start+S.fejl*3000;const b=P.gange[S.tab];
  S.ms=ms;S.ny=!b||ms<b.ms;if(S.ny)P.gange[S.tab]={ms,fejl:S.fejl};save();S.screen='gangeslut';render();if(S.ny&&S.fejl===0)konfetti();}
function rGangeSlut(){return `
  <div class="opk" style="border-top:6px solid var(--gange)"><h2>${jagtNavn(S.tab)}</h2>
   <div class="score" style="color:var(--gange)">${fmt(S.ms)}</div>
   <p>${S.fejl===0?'Ingen fejl!':`${S.fejl} fejl (hver fejl koster 3 sekunder).`} ${S.ny?'Ny rekord!':`Din rekord er ${fmt(P.gange[S.tab].ms)}.`}</p>
   <div class="rad"><button class="knap lys" data-go="gangevalg">Vælg jagt</button><button class="knap brass" style="background:var(--gange)" data-tab="${S.tab}">Igen</button></div></div>`;}

// ---------- Konfetti ----------
function konfetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='konf';document.body.appendChild(c);const x=c.getContext('2d');
  c.width=innerWidth;c.height=innerHeight;const farver=['#a8771f','#b8382f','#1f5fa8','#2f8a4a','#0e8a8a','#e0b24a'];
  const p=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:4+Math.random()*5,f:pick(farver),a:Math.random()*6}));
  const t0=performance.now();(function frame(t){x.clearRect(0,0,c.width,c.height);
    p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.a+=.1;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.f;x.fillRect(-q.r/2,-q.r/2,q.r,q.r*.6);x.restore()});
    if(t-t0<2800)requestAnimationFrame(frame);else c.remove()})(t0);}

// ---------- Events ----------
function bind(){
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{clearInterval(gTimer);const g=b.dataset.go;if(g==='hjem')go({screen:'hjem'});else if(g==='gangevalg')go({screen:'gangevalg'})});
  app.querySelectorAll('[data-sag]').forEach(b=>b.onclick=()=>go({screen:'intro',sag:SAGER.find(s=>s.id===b.dataset.sag)}));
  app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startSag(b.dataset.start));
  app.querySelectorAll('[data-traen]').forEach(b=>b.onclick=()=>startTraen(b.dataset.traen));
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>startGange(b.dataset.tab));
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>gTast(b.dataset.d));
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>tjek(b.dataset.opt));
  app.querySelectorAll('[data-mist]').forEach(b=>b.onclick=()=>anklag(+b.dataset.mist));
  const f=document.getElementById('ansform');if(f)f.onsubmit=e=>{e.preventDefault();const v=document.getElementById('ans').value;if(v.trim())tjek(v)};
}
app.addEventListener('click',e=>{if(e.target.id==='naeste')naeste()});
document.addEventListener('keydown',e=>{if(S.screen!=='gange')return;if(/^[0-9]$/.test(e.key))gTast(e.key);else if(e.key==='Backspace')gTast('slet');else if(e.key==='Enter')gTast('ok')});

load();genoptag();render();
</script>

</body>

     if(S.screen==='hjem')render();
     const fb=document.createElement('div');fb.className='fb ok';fb.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;z-index:9;box-shadow:var(--shadow)';
     fb.innerHTML='<div class="t">Dine stjerner er hentet tilbage!</div>';document.body.appendChild(fb);setTimeout(()=>fb.remove(),4000);
   }).catch(()=>{})}


// ---------- Gemt fremgang ----------
let P;
function load(){try{P=JSON.parse(localStorage.getItem(LS))||{}}catch(e){P={}}
  P.sager=P.sager||{};P.set=P.set||{dansk:[],eng:[]};P.rigtige=P.rigtige||0;P.spm=P.spm||0;P.gange=P.gange||{};P.dage=P.dage||[];}
function save(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}sync()}
function noterDag(){const d=new Date().toISOString().slice(0,10);if(!P.dage.includes(d)){P.dage.push(d);save()}}
function pickItem(fag){
  const bank=fag==='dansk'?DANSK:ENGELSK;let seen=P.set[fag];
  const niv=niveau();const ok=i=>(bank[i].n||1)<=niv;
  let kand=bank.map((_,i)=>i).filter(i=>ok(i)&&!seen.includes(i));
  if(!kand.length){seen=P.set[fag]=[];kand=bank.map((_,i)=>i).filter(ok)}
  const i=pick(kand);seen.push(i);save();
  const it=bank[i];return{type:'mc',q:it.q,t:it.t,svar:it.o[0],opts:shuffle(it.o),f:it.f};
}
function lavMat(){const niv=niveau();const pool=MAT.concat(niv>=2?MAT2:[],niv>=3?MAT3:[]);const it=pick(pool)();
  if(it.mc)return{type:'mc',q:it.q,svar:it.o[0],opts:shuffle(it.o),f:it.f};
  return{type:'tal',q:it.q,svar:String(it.s),f:it.f};}
function lavSpm(fag){return fag==='mat'?lavMat():pickItem(fag)}

// ---------- Tilstand og rendering ----------
let S={screen:'hjem'};
const app=document.getElementById('app');
function go(s){S=s;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){
  const r={hjem:rHjem,intro:rIntro,q:rQ,deduk:rDeduk,opklaret:rOpklaret,traenslut:rTraenSlut,gangevalg:rGangeValg,gange:rGange,gangeslut:rGangeSlut}[S.screen];
  app.innerHTML=r();bind();gemS();sync();
}
// Gem hvor hun er naaet til (sag eller traening), saa appen kan lukkes og aabnes igen
function gemS(){try{if(S.screen==='q'||S.screen==='deduk'){const g=Object.assign({},S,{sag:S.sag?S.sag.id:undefined});localStorage.setItem(LS+'_s',JSON.stringify(g))}else localStorage.removeItem(LS+'_s')}catch(e){}}
function genoptag(){try{const g=JSON.parse(localStorage.getItem(LS+'_s')||'null');if(!g||!g.screen)return;if(g.sag){g.sag=SAGER.find(s=>s.id===g.sag);if(!g.sag)return}if(g.mode==='sag'&&!g.sag)return;if(g.mode==='sag'&&g.qs.length!==N_SPM)return;S=g}catch(e){}}
function stjerner(n){return '★'.repeat(n)+'☆'.repeat(3-n)}

function rHjem(){
  const done=Object.values(P.sager).filter(x=>x.done).length;
  const st=Object.values(P.sager).reduce((a,x)=>a+(x.stars||0),0);
  return `
  <header class="brand"><h1>Detektiv ${NAVN}</h1><small>Detektivbureauet · 2. klasse</small></header>
  <div class="stats"><div class="stat">Løste sager <b>${done}/${SAGER.length}</b></div><div class="stat">Stjerner <b>${st}</b></div><div class="stat">Dage som detektiv <b>${P.dage.length}</b></div><div class="stat">Niveau <b>${niveau()}</b> ${NIVEAU_NAVN[niveau()]}</div></div>
  <section class="sektion"><div class="sektion-h"><h2>Sager</h2><span>${N_SPM} opgaver pr. sag</span></div>
  ${SAGER.map((s,i)=>{const p=P.sager[s.id]||{};const kl=p.done?'done':(p.igang?'igang':'');
    const status=p.done?`<span class="stjerner">${stjerner(p.stars)}</span>`:(p.igang?'I gang':'Ny sag');
    return `<button class="mappe ${kl}" data-sag="${s.id}" data-nr="Sag nr. ${i+1}"><h3>${esc(s.titel)}</h3><div class="sted">${esc(s.sted)}</div><div class="status">${status}</div></button>`}).join('')}
  </section>
  <section class="sektion"><div class="sektion-h"><h2>Regnejagten</h2><span>på tid</span></div>
   <button class="gangeknap" data-go="gangevalg"><div><b>Plus, minus og gange</b><small>Vælg en jagt og svar så hurtigt du kan</small></div><span>→</span></button>
  </section>
  <section class="sektion"><div class="sektion-h"><h2>Træning</h2><span>${N_TRAEN} opgaver i ét fag</span></div>
   <div class="fagrad">${Object.entries(FAG).map(([k,f])=>`<button class="fagknap" style="--f:${f.farve}" data-traen="${k}">${f.navn}<small>${N_TRAEN} opgaver</small></button>`).join('')}</div>
  </section>`;
}
function rIntro(){const s=S.sag;return `
  <header class="top"><button class="lnk" data-go="hjem">← Sager</button></header>
  <div class="intro"><div class="sted">${esc(s.sted)}</div><h2>${esc(s.titel)}</h2><p class="hist">${esc(s.intro)}</p>
   <div><b>${s.erSted?'Måske er hun':'De mistænkte'}:</b> ${s.mist.map(m=>esc(s.erSted?m.navn.toLowerCase():m.navn)).join(', ')}.</div>
   <p>Løs ${N_SPM} opgaver og find 3 ledetråde. Så kan du løse sagen!</p>
   <div class="rad"><button class="knap brass" data-start="${s.id}">Start sagen</button></div></div>`;}
function rQ(){const it=S.item,f=FAG[S.fag];const n=S.qs.length;
  const prog=`<div class="prog">${Array.from({length:n},(_,i)=>`<i class="${i<S.i?'d':(i===S.i?'n':'')}"></i>`).join('')}</div>`;
  let svar;
  if(it.type==='mc')svar=`<div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-opt="${esc(o)}" id="opt${i}"><span class="b">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  else svar=`<form class="ans" id="ansform"><input id="ans" inputmode="numeric" autocomplete="off" placeholder="Skriv tallet" aria-label="Dit svar"><button class="knap" type="submit">Tjek</button></form>`;
  return `<header class="top"><button class="lnk" data-go="hjem">← ${S.mode==='sag'?'Sagen':'Træning'}</button>${prog}</header>
   <span class="fag" style="--f:${f.farve}">${f.navn}</span>
   <div class="side"><div class="qtext">${it.t?`<span class="tekst">${esc(it.t)}</span>`:''}${esc(it.q)}</div>${svar}</div>
   <div id="fb"></div>`;}
function rDeduk(){const s=S.sag;return `
  <header class="top"><button class="lnk" data-go="hjem">← Sager</button></header>
  <div class="intro"><div class="sted">${esc(s.titel)}</div><h2>${esc(s.titelD||'Hvem var det?')}</h2>
   <div class="sporliste">${s.spor.map(sp=>`<div class="spor"><span class="lup">Ledetråd</span><span>${esc(sp.tekst)}</span></div>`).join('')}</div>
   <p>Kig på ledetrådene. Tryk på ${s.erSted?'det sted, du tror, hun er':'den, du tror, det var'}.</p></div>
  <div class="mist">${s.mist.map((m,i)=>{const ude=S.ude.includes(i);
    return `<button class="mistk ${ude?'ude':''}" data-mist="${i}" ${ude?'disabled':''}><b>${esc(m.navn)}</b><span class="rolle">${esc(m.rolle)}</span>
     <div class="traek">${Object.entries(m.t).map(([k,v])=>`<span>${esc(s.labels[k])}: ${esc(v)}</span>`).join('')}</div></button>`}).join('')}</div>
  <div id="fb"></div>`;}
function rOpklaret(){const s=S.sag,p=P.sager[s.id];return `
  <div class="opk"><div class="stempel">Løst</div><h2>${esc(s.titel)}</h2>
   <div class="store">${stjerner(p.stars)}</div>
   <p><b>${s.erSted?`Hun var ${esc(s.skyldig.toLowerCase())}!`:`Det var ${esc(s.skyldig)}!`}</b></p><p>${esc(s.loesning)}</p>
   <p style="color:var(--muted)">${S.fejl===0?'Ingen fejl. Du er en superdetektiv!':S.fejl===1?'Kun én fejl. Flot!':`${S.fejl} fejl. Men sagen er løst!`}</p>
   <div class="rad"><button class="knap brass" data-go="hjem">Tilbage til sagerne</button></div></div>`;}
function rTraenSlut(){const f=FAG[S.fag];const r=S.qs.length-S.fejl;return `
  <div class="opk"><span class="fag" style="--f:${f.farve};align-self:center">${f.navn}</span><h2>Træning færdig</h2>
   <div class="score">${r} / ${S.qs.length}</div>
   <p>${r===S.qs.length?'Alle rigtige! Fantastisk!':r>=S.qs.length-2?'Godt gået!':'Godt kæmpet. Prøv igen!'}</p>
   <div class="rad"><button class="knap lys" data-go="hjem">Hjem</button><button class="knap brass" data-traen="${S.fag}">Igen</button></div></div>`;}

// ---------- Opgave-flow ----------
function startSag(id){const sag=SAGER.find(s=>s.id===id);noterDag();
  P.sager[id]=P.sager[id]||{};P.sager[id].igang=true;save();
  const fag=shuffle(FAGMIX);
  S={screen:'q',mode:'sag',sag,qs:fag,i:0,fejl:0,forsog:0};nyt();}
function startTraen(fag){noterDag();S={screen:'q',mode:'traen',fag,qs:Array(N_TRAEN).fill(fag),i:0,fejl:0,forsog:0};nyt();}
function nyt(){S.fag=S.qs[S.i];S.item=lavSpm(S.fag);S.forsog=0;S.screen='q';S.t0=Date.now();render();const inp=document.getElementById('ans');if(inp)inp.focus();}
function norm(v){return String(v).trim().toLowerCase().replace(/\s+/g,'').replace(/\./g,'').replace(',','.')}
function tjek(svar){const it=S.item;const rigtigt=norm(svar)===norm(it.svar);
  P.spm++;if(rigtigt&&S.forsog===0)P.rigtige++;if(rigtigt||S.forsog>=1)brugNoter(rigtigt&&S.forsog===0);save();
  if(rigtigt){logSvar(true);save();vis(true,svar);return}
  S.forsog++;if(S.forsog===1){S.fejl++;visPrøvIgen(svar)}else{logSvar(false);save();vis(false,svar)}}
function visPrøvIgen(svar){const fb=document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.opt===svar){b.classList.add('bad');b.disabled=true}});
  const inp=document.getElementById('ans');if(inp){inp.classList.add('bad');inp.select()}
  fb.innerHTML=`<div class="fb bad"><div class="t">Ikke helt. Prøv én gang til!</div></div>`;}
function vis(rigtigt,svar){const it=S.item,fb=document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.opt===it.svar)b.classList.add('ok');else if(b.dataset.opt===svar&&!rigtigt)b.classList.add('bad')});
  const inp=document.getElementById('ans');if(inp){inp.disabled=true;inp.classList.add(rigtigt?'ok':'bad');document.querySelector('#ansform button').disabled=true}
  let h='';
  if(rigtigt)h+=`<div class="t">${pick(['Rigtigt!','Flot!','Ja!','Godt set, detektiv!','Super!'])}</div>`;
  else h+=`<div class="t">Det rigtige svar er: ${esc(it.svar)}</div>`;
  if(it.f)h+=`<div class="fork">${esc(it.f)}</div>`;
  const sidste=S.i===S.qs.length-1;
  if(S.mode==='sag'){h+=`<p class="hist">${esc(S.sag.hist[S.i])}</p>`;
    const k=SPOR_VED.indexOf(S.i);if(k>=0)h+=`<div class="spor"><span class="lup">Ledetråd ${k+1}</span><span>${esc(S.sag.spor[k].tekst)}</span></div>`;}
  h+=`<div class="rad"><button class="knap brass" id="naeste">${sidste?(S.mode==='sag'?'Løs sagen →':'Se resultat →'):'Næste →'}</button></div>`;
  fb.innerHTML=`<div class="fb ${rigtigt?'ok':'bad'}">${h}</div>`;
  const b=document.getElementById('naeste');b.focus();b.scrollIntoView({block:'nearest',behavior:'smooth'});}
function naeste(){S.i++;
  if(S.i<S.qs.length){nyt();return}
  if(S.mode==='sag'){S.screen='deduk';S.ude=[];render()}else{S.screen='traenslut';render()}}
function anklag(i){const s=S.sag,m=s.mist[i];
  if(m.navn===s.skyldig){const stars=S.fejl<=1?3:(S.fejl<=3?2:1);const p=P.sager[s.id];
    p.done=true;p.igang=false;p.stars=Math.max(p.stars||0,stars);save();S.screen='opklaret';render();konfetti();return}
  const sp=s.spor.find(x=>m.t[x.n]!==x.v);S.ude.push(i);
  render();document.getElementById('fb').innerHTML=`<div class="fb bad"><div class="t">Nej, ${s.erSted?'hun er ikke '+esc(m.navn.toLowerCase()):'det var ikke '+esc(m.navn)}.</div>
   <div class="fork">${esc(s.labels[sp.n])}: ${esc(m.t[sp.n])}. Men ledetråden siger: "${esc(sp.tekst)}"</div></div>`;
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});}

// ---------- Regnejagten ----------
const JAGTER=[{id:'plus',navn:'Plus til 20',kort:'Plus'},{id:'minus',navn:'Minus til 20',kort:'Minus'},{id:'2',navn:'2-tabellen',kort:'2 ·'},{id:'5',navn:'5-tabellen',kort:'5 ·'},{id:'10',navn:'10-tabellen',kort:'10 ·'},{id:'bland',navn:'Blandet',kort:'Alt'}];
const jagtNavn=id=>JAGTER.find(j=>j.id===id).navn;
function rGangeValg(){return `
  <header class="top"><button class="lnk" data-go="hjem">← Hjem</button></header>
  <div class="intro" style="border-left:6px solid var(--gange)"><h2>Regnejagten</h2><p>Vælg en jagt. Du får ${N_JAGT} regnestykker, og uret kører. Slå din egen bedste tid!</p></div>
  <div class="tabeller">${JAGTER.map(j=>{const b=P.gange[j.id];return `<button class="tab" data-tab="${j.id}">${j.navn}<small>${b?`bedst ${fmt(b.ms)} · ${b.fejl} fejl`:'ny'}</small></button>`}).join('')}</div>`;}
function fmt(ms){const s=Math.round(ms/100)/10;return s.toFixed(1).replace('.',',')+' s'}
function lavStykke(id){
  if(id==='bland')id=pick(['plus','minus','2','5','10']);
  if(id==='plus'){const a=rnd(1,15),b=rnd(1,20-a);return{a,b,op:'+',s:a+b}}
  if(id==='minus'){const a=rnd(3,20),b=rnd(1,a-1);return{a,b,op:'−',s:a-b}}
  const t=+id,b=rnd(1,10);return Math.random()<.5?{a:t,b,op:'·',s:t*b}:{a:b,b:t,op:'·',s:t*b};}
let gTimer=null;
function startGange(tab){noterDag();const qs=Array.from({length:N_JAGT},()=>lavStykke(tab));
  S={screen:'gange',tab,qs,i:0,fejl:0,inp:'',start:Date.now(),laast:false};render();
  clearInterval(gTimer);gTimer=setInterval(()=>{const e=document.getElementById('tid');if(e)e.textContent=fmt(Date.now()-S.start);else clearInterval(gTimer)},100);}
function rGange(){const q=S.qs[S.i];return `
  <header class="top"><button class="lnk" data-go="gangevalg">← Afbryd</button><div class="ur"><span class="tid" id="tid">${fmt(Date.now()-S.start)}</span></div></header>
  <div class="side gspil" style="background-image:none">
   <div class="ur"><span>${jagtNavn(S.tab)}</span><span>${S.i+1} / ${S.qs.length} · ${S.fejl} fejl</span></div>
   <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
   <div class="gq" id="gq">${q.a} ${q.op} ${q.b} = ?</div>
   <div class="gsvar" id="gsvar">${S.inp||'&nbsp;'}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button data-d="slet">⌫</button><button data-d="0">0</button><button data-d="ok" class="ok">OK</button></div>
  </div>`;}
function gTast(d){if(S.laast)return;
  if(d==='slet')S.inp=S.inp.slice(0,-1);else if(d==='ok')return gTjek();else if(S.inp.length<3)S.inp+=d;
  document.getElementById('gsvar').innerHTML=S.inp||'&nbsp;';
  const q=S.qs[S.i];if(S.inp.length&&+S.inp===q.s&&String(q.s).length===S.inp.length)gTjek();}
function gTjek(){if(!S.inp)return;const q=S.qs[S.i];const ok=+S.inp===q.s;const gq=document.getElementById('gq');
  S.laast=true;gq.textContent=`${q.a} ${q.op} ${q.b} = ${q.s}`;
  if(ok){gq.classList.add('ok');setTimeout(()=>{S.i++;S.inp='';S.laast=false;if(S.i>=S.qs.length)gSlut();else render()},350)}
  else{S.fejl++;gq.classList.add('bad');document.getElementById('gsvar').textContent=S.inp+' ✗';
    setTimeout(()=>{S.i++;S.inp='';S.laast=false;if(S.i>=S.qs.length)gSlut();else render()},1400)}}
function gSlut(){clearInterval(gTimer);const ms=Date.now()-S.start+S.fejl*3000;const b=P.gange[S.tab];
  try{const d=new Date().toISOString().slice(0,10);P.brug=P.brug||{};const u=P.brug[d]||(P.brug[d]={spm:0,rigtige:0,sek:0});u.spm+=S.qs.length;u.rigtige+=S.qs.length-S.fejl;u.sek+=Math.round((Date.now()-S.start)/1000)}catch(e){}
  S.ms=ms;S.ny=!b||ms<b.ms;if(S.ny)P.gange[S.tab]={ms,fejl:S.fejl};save();S.screen='gangeslut';render();if(S.ny&&S.fejl===0)konfetti();}
function rGangeSlut(){return `
  <div class="opk" style="border-top:6px solid var(--gange)"><h2>${jagtNavn(S.tab)}</h2>
   <div class="score" style="color:var(--gange)">${fmt(S.ms)}</div>
   <p>${S.fejl===0?'Ingen fejl!':`${S.fejl} fejl (hver fejl koster 3 sekunder).`} ${S.ny?'Ny rekord!':`Din rekord er ${fmt(P.gange[S.tab].ms)}.`}</p>
   <div class="rad"><button class="knap lys" data-go="gangevalg">Vælg jagt</button><button class="knap brass" style="background:var(--gange)" data-tab="${S.tab}">Igen</button></div></div>`;}

// ---------- Konfetti ----------
function konfetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='konf';document.body.appendChild(c);const x=c.getContext('2d');
  c.width=innerWidth;c.height=innerHeight;const farver=['#a8771f','#b8382f','#1f5fa8','#2f8a4a','#0e8a8a','#e0b24a'];
  const p=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:4+Math.random()*5,f:pick(farver),a:Math.random()*6}));
  const t0=performance.now();(function frame(t){x.clearRect(0,0,c.width,c.height);
    p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.a+=.1;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.f;x.fillRect(-q.r/2,-q.r/2,q.r,q.r*.6);x.restore()});
    if(t-t0<2800)requestAnimationFrame(frame);else c.remove()})(t0);}

// ---------- Events ----------
function bind(){
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{clearInterval(gTimer);const g=b.dataset.go;if(g==='hjem')go({screen:'hjem'});else if(g==='gangevalg')go({screen:'gangevalg'})});
  app.querySelectorAll('[data-sag]').forEach(b=>b.onclick=()=>go({screen:'intro',sag:SAGER.find(s=>s.id===b.dataset.sag)}));
  app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startSag(b.dataset.start));
  app.querySelectorAll('[data-traen]').forEach(b=>b.onclick=()=>startTraen(b.dataset.traen));
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>startGange(b.dataset.tab));
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>gTast(b.dataset.d));
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>tjek(b.dataset.opt));
  app.querySelectorAll('[data-mist]').forEach(b=>b.onclick=()=>anklag(+b.dataset.mist));
  const f=document.getElementById('ansform');if(f)f.onsubmit=e=>{e.preventDefault();const v=document.getElementById('ans').value;if(v.trim())tjek(v)};
}
app.addEventListener('click',e=>{if(e.target.id==='naeste')naeste()});
document.addEventListener('keydown',e=>{if(S.screen!=='gange')return;if(/^[0-9]$/.test(e.key))gTast(e.key);else if(e.key==='Backspace')gTast('slet');else if(e.key==='Enter')gTast('ok')});

load();genoptag();render();gendan();sync();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})}).catch(()=>{})});let _ny=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_ny)return;_ny=true;const s=window.S;if(!s||s.screen==='hjem'||s.screen==='gangevalg'||s.screen==='intro')location.reload()})}</script>

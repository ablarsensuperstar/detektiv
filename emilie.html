<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2236">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Detektiv Emilie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest-emilie.webmanifest">

<style>
/* Layout: ét smalt spor (max 560px) som en detektivs notesbog. Sagsmapper som kartotekskort med messingfane, opgaver på en linjeret side. */
:root{
  --bg:#e7eaf0;
  --paper:#faf8f1;
  --paper2:#f1eee3;
  --ink:#1b2236;
  --muted:#5d6579;
  --line:#cdd3de;
  --rule:#d9d2bf;
  --brass:#a8771f;
  --brass-soft:#f1e4c4;
  --wax:#b8382f;
  --ok:#2f8a4a;
  --ok-soft:#dff2e4;
  --bad:#c23b2f;
  --bad-soft:#f8e0dc;
  --dansk:#b8382f;
  --mat:#1f5fa8;
  --eng:#2f8a4a;
  --gange:#7a3fa0;
  --shadow:0 6px 18px rgba(27,34,54,.12);
  --display:'Special Elite','Courier New',monospace;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111624; --paper:#1b2234; --paper2:#222b40; --ink:#ebe6d8; --muted:#a4aabb; --line:#303a52; --rule:#2c3449;
    --brass:#d3a44c; --brass-soft:#3a3120; --wax:#e0564a; --ok:#5cc07a; --ok-soft:#1d3a28; --bad:#ef6a5e; --bad-soft:#44231f;
    --dansk:#ef6a5e; --mat:#6aa6ec; --eng:#5cc07a; --gange:#c58df0; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111624; --paper:#1b2234; --paper2:#222b40; --ink:#ebe6d8; --muted:#a4aabb; --line:#303a52; --rule:#2c3449;
  --brass:#d3a44c; --brass-soft:#3a3120; --wax:#e0564a; --ok:#5cc07a; --ok-soft:#1d3a28; --bad:#ef6a5e; --bad-soft:#44231f;
  --dansk:#ef6a5e; --mat:#6aa6ec; --eng:#5cc07a; --gange:#c58df0; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.9rem}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.lnk{color:var(--muted);font-weight:700;padding:8px 4px;border-radius:8px}
.lnk:hover{color:var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{font-family:var(--display);color:var(--brass);letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;display:flex;gap:6px;align-items:center}
.stat b{color:var(--brass);font-variant-numeric:tabular-nums}
.sektion{display:flex;flex-direction:column;gap:10px}
.sektion-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sektion-h span{color:var(--muted);font-size:.9rem;font-weight:700}
/* sagsmappe */
.mappe{position:relative;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px 14px 14px 14px;padding:16px 16px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;margin-top:14px}
.mappe::before{content:attr(data-nr);position:absolute;top:-14px;left:14px;background:var(--brass);color:#fff;font-family:var(--display);font-size:.75rem;letter-spacing:.1em;padding:2px 10px;border-radius:6px 6px 0 0}
.mappe h3{grid-column:1}
.mappe .sted{grid-column:1;color:var(--muted);font-size:.9rem}
.mappe .status{grid-column:2;grid-row:1/3;font-weight:800;font-size:.85rem;padding:6px 10px;border-radius:999px;background:var(--paper2);color:var(--muted);white-space:nowrap}
.mappe.done .status{background:var(--ok-soft);color:var(--ok)}
.mappe.igang .status{background:var(--brass-soft);color:var(--brass)}
.mappe.laast{opacity:.6}
.mappe:hover{transform:translateY(-1px)}
.stjerner{color:var(--brass);letter-spacing:.05em}
/* træning */
.fagrad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fagknap{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--f);border-radius:12px;padding:14px 10px;font-weight:800;box-shadow:var(--shadow)}
.fagknap small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.gangeknap{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--gange);border-radius:12px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.gangeknap small{display:block;color:var(--muted);font-weight:600;font-size:.85rem}
/* spørgsmål */
.prog{display:flex;gap:6px;align-items:center}
.prog i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.prog i.d{background:var(--brass);border-color:var(--brass)}
.prog i.n{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.fag{align-self:flex-start;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--f);padding:4px 12px;border-radius:999px}
.side{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 18px;border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.qtext{font-size:1.25rem;font-weight:700;line-height:1.45}
.qtext .tekst{display:block;font-weight:600;font-size:1.05rem;font-style:italic;color:var(--muted);margin-bottom:10px;padding:10px 12px;background:var(--paper2);border-radius:8px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--paper2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;min-height:52px;display:flex;align-items:center;gap:12px;transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .b{width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;flex:none;font-family:var(--display)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);opacity:.7}
.opt:disabled{cursor:default}
.ans{display:flex;gap:10px}
.ans input{flex:1;min-width:0;font:inherit;font-size:1.3rem;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper2);color:var(--ink);font-variant-numeric:tabular-nums}
.ans input.ok{border-color:var(--ok)}
.ans input.bad{border-color:var(--bad)}
.knap{background:var(--ink);color:var(--bg);font-weight:800;padding:12px 20px;border-radius:12px;min-height:48px}
.knap.brass{background:var(--brass);color:#fff}
.knap.lys{background:var(--paper2);color:var(--ink);border:1px solid var(--line)}
.knap:disabled{opacity:.5;cursor:default}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--paper)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb .t{font-weight:800;font-size:1.05rem}
.fb.ok .t{color:var(--ok)}
.fb.bad .t{color:var(--bad)}
.fb .fork{color:var(--muted);font-size:.95rem}
.hist{font-family:var(--display);font-size:1.02rem;line-height:1.5;border-left:3px solid var(--brass);padding-left:12px}
.spor{background:var(--brass-soft);border:1px dashed var(--brass);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.spor .lup{font-family:var(--display);color:var(--brass);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;flex:none;padding-top:3px}
.rad{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* intro / deduktion */
.intro{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.intro .sted{font-family:var(--display);color:var(--brass);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.intro p.hist{font-family:var(--body);border:0;padding:0;font-size:1.05rem}
.mist{display:grid;gap:10px}
.mistk{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.mistk:hover{border-color:var(--brass)}
.mistk b{font-size:1.05rem}
.mistk .rolle{color:var(--muted);font-size:.9rem}
.traek{display:flex;flex-wrap:wrap;gap:6px}
.traek span{font-size:.82rem;font-weight:700;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.traek span.x{text-decoration:line-through;opacity:.55}
.mistk.ude{opacity:.5}
.mistk.ude:hover{border-color:var(--line)}
.sporliste{display:flex;flex-direction:column;gap:8px}
.anklag{background:var(--paper2);border:2px solid var(--brass);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
/* opklaret */
.opk{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.opk .stempel{font-family:var(--display);color:var(--wax);border:3px solid var(--wax);border-radius:8px;padding:6px 16px;font-size:1.4rem;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-4deg)}
.opk .store{font-size:2.2rem;color:var(--brass);letter-spacing:.1em}
.opk p{max-width:46ch}
.score{font-size:3rem;font-family:var(--display);color:var(--brass);font-variant-numeric:tabular-nums}
/* gangespil */
.tabeller{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tab{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 4px;font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab small{font-weight:700;color:var(--muted);font-size:.7rem}
.tab:hover{border-color:var(--gange)}
.tab.bland{grid-column:1/-1}
.gspil{display:flex;flex-direction:column;gap:14px}
.ur{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.ur .tid{font-family:var(--display);font-size:1.5rem;color:var(--gange)}
.gq{font-size:3rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.gq.ok{color:var(--ok)}
.gq.bad{color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:var(--paper2);border:2px solid var(--line);border-radius:12px;font-size:1.5rem;font-weight:800;min-height:56px;font-variant-numeric:tabular-nums}
.pad button:active{transform:scale(.97)}
.pad button.ok{background:var(--gange);color:#fff;border-color:var(--gange)}
.gsvar{text-align:center;font-size:2rem;font-weight:800;min-height:44px;font-variant-numeric:tabular-nums;color:var(--gange)}
.bar{height:8px;background:var(--paper2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gange);width:0;transition:width .2s}
canvas.konf{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
@media (max-width:420px){.fagrad{grid-template-columns:1fr 1fr 1fr}.tabeller{grid-template-columns:repeat(3,1fr)}.gq{font-size:2.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
'use strict';
// ---------- Hjælpere ----------
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS='detektiv_emilie_v1';
const FAG={dansk:{navn:'Dansk',farve:'var(--dansk)'},mat:{navn:'Matematik',farve:'var(--mat)'},eng:{navn:'Engelsk',farve:'var(--eng)'}};

// ---------- Sagerne ----------
const SAGER=[
{id:'kage',titel:'Den forsvundne lagkage',sted:'Sommerhuset ved Vesterhavet',
 intro:'Det regner over sommerhuset, og i dag fylder bedste 70 år. Men da Emilie åbner køleskabet for at hente lagkagen, er fadet tomt. Kun lidt flødeskum og nogle melede fodspor er tilbage.',
 labels:{haar:'Hår',sko:'Sko',ting:'Havde med'},
 mist:[
  {navn:'Morfar Finn Drost',rolle:'elsker kage og siger, han var på fisketur',t:{haar:'gråt',sko:'gummistøvler',ting:'en paraply'}},
  {navn:'Tante Lis',rolle:'bagte selv kagen i går',t:{haar:'gråt',sko:'sandaler',ting:'en kurv'}},
  {navn:'Viktor fra nabohuset',rolle:'9 år og altid sulten',t:{haar:'lyst',sko:'gummistøvler',ting:'en rygsæk'}},
  {navn:'Fætter Oskar',rolle:'siger, han sov til middag',t:{haar:'brunt',sko:'gummistøvler',ting:'en paraply'}}],
 spor:[
  {tekst:'Fodsporene i det spildte mel er fra gummistøvler.',n:'sko',v:'gummistøvler'},
  {tekst:'Der sidder et langt, gråt hår fast på kagefadet.',n:'haar',v:'gråt'},
  {tekst:'Ved bagdøren står en våd paraply, som ingen vil kendes ved.',n:'ting',v:'en paraply'}],
 skyldig:'Morfar Finn Drost',
 loesning:'Morfar Finn tilstod. Han ville bare smage et lille stykke, men så smagte han et til … og et til. Resten af kagen stod gemt i bådskuret, og bedste grinede, så hun fik tårer i øjnene.',
 hist:[
  'Du tager din notesbog frem. Første regel for en detektiv: Se dig godt omkring, før du drager konklusioner.',
  'Køkkenvinduet står på klem. Udenfor er græsset trampet ned, så nogen er gået den vej.',
  'Du bøjer dig ned over de melede fodspor på gulvet og måler dem omhyggeligt.',
  'Tante Lis sværger, at kagen stod i køleskabet klokken tre. Det er altså sket inden for de sidste to timer.',
  'Viktor fra nabohuset kigger ind ad vinduet. "Jeg har ikke spist noget!" råber han, før nogen har spurgt.',
  'Du undersøger det tomme kagefad med lup. Der sidder noget fast i flødeskummet …',
  'Fætter Oskar gaber og siger, han har sovet hele eftermiddagen. Men hans støvler er våde.',
  'Du går ud ad bagdøren. Regnen siler ned, og noget står lænet op ad væggen.']},
{id:'sand',titel:'Sandborgen der forsvandt',sted:'Stranden ved campingpladsen',
 intro:'Hele eftermiddagen byggede børnene på campingpladsen en kæmpe sandborg med voldgrav og tre tårne. Næste morgen er den trampet flad. Hvem har været på stranden i nattens mulm og mørke?',
 labels:{spor:'Fodspor',tid:'På stranden',ting:'Kendetegn'},
 mist:[
  {navn:'Hunden Bjørn',rolle:'campingpladsens store, glade hund',t:{spor:'poter',tid:'om natten',ting:'elsker at grave'}},
  {navn:'Morfar Finn Drost',rolle:'går morgentur barfodet i vandkanten',t:{spor:'bare fødder',tid:'ved solopgang',ting:'har en stok'}},
  {navn:'Surfer-Sune',rolle:'bor i den blå campingvogn',t:{spor:'bare fødder',tid:'ved solopgang',ting:'bruger surfvoks'}},
  {navn:'Lille Ida',rolle:'5 år og vild med sandslotte',t:{spor:'bare fødder',tid:'i seng kl. 19',ting:'har spand og skovl'}}],
 spor:[
  {tekst:'Sporene i sandet er fra bare menneskefødder, ikke poter.',n:'spor',v:'bare fødder'},
  {tekst:'En nabo i telt 12 hørte nogen gå rundt på stranden ved solopgang.',n:'tid',v:'ved solopgang'},
  {tekst:'I voldgraven ligger små klatter af blåt surfvoks.',n:'ting',v:'bruger surfvoks'}],
 skyldig:'Surfer-Sune',
 loesning:'Sune tabte sin nøgle i sandet aftenen før og ledte efter den ved solopgang. Han fandt nøglen, men sandborgen overlevede ikke. Nu har han lovet at hjælpe med at bygge en ny, der er dobbelt så stor.',
 hist:[
  'Du går en runde om ruinerne af sandborgen. Et godt sted at starte: Hvad er der stadig tilbage?',
  'Tårn nummer tre står faktisk endnu. Så hvem det end var, var det nok ikke med vilje.',
  'Du finder tydelige aftryk i det fugtige sand ved voldgraven og måler dem med din lineal.',
  'Lille Ida græder. "Det var ikke mig!" Hendes mor nikker: Ida sov allerede klokken syv.',
  'Hunden Bjørn logrer og graver et hul lige ved siden af dig. Han er i hvert fald ikke god til at skjule noget.',
  'Du går fra telt til telt og spørger, om nogen hørte noget i nat.',
  'Morfar Finn siger, han gik sin morgentur klokken seks, men kun langs vandkanten.',
  'Du graver forsigtigt i voldgraven og finder noget klistret og blåt.']},
{id:'brev',titel:'Det hemmelige brev',sted:'Biblioteket i feriebyen',
 intro:'På biblioteket i feriebyen falder en lille seddel ud af en bog. Der står med sirlig skrift: "Mød mig ved fyrtårnet, når solen går ned." Ingen afsender. Hvem har skrevet den, og hvorfor?',
 labels:{pen:'Skriver med',duft:'Dufter af',bog:'Yndlingsbøger'},
 mist:[
  {navn:'Hr. Holm',rolle:'bibliotekar med små, runde briller',t:{pen:'blå fyldepen',duft:'gamle bøger',bog:'krimier'}},
  {navn:'Postbud Pia',rolle:'cykler rundt med dagens post',t:{pen:'rød kuglepen',duft:'cykelolie',bog:'digte'}},
  {navn:'Morfar Finn Drost',rolle:'går tur til fyrtårnet hver aften',t:{pen:'blyant',duft:'pibetobak',bog:'krimier'}},
  {navn:'Fru Birk fra bageriet',rolle:'bager byens bedste kanelsnegle',t:{pen:'blå fyldepen',duft:'kanel',bog:'kogebøger'}}],
 spor:[
  {tekst:'Sedlen er skrevet med blåt blæk fra en fyldepen.',n:'pen',v:'blå fyldepen'},
  {tekst:'Papiret dufter svagt af kanel.',n:'duft',v:'kanel'},
  {tekst:'Sedlen lå i en kogebog om kager.',n:'bog',v:'kogebøger'}],
 skyldig:'Fru Birk fra bageriet',
 loesning:'Fru Birk tilstod med et smil. Sedlen var til hendes mand: en invitation til en overraskelses-picnic ved fyrtårnet på deres bryllupsdag. Han havde bare lånt den forkerte bog med hjem.',
 hist:[
  'Du lægger sedlen forsigtigt i en plastiklomme. Et bevis må aldrig blive beskidt.',
  'Hr. Holm pudser sine briller og siger, at bogen blev afleveret i morges, men han så ikke af hvem.',
  'Du holder sedlen op mod lyset og ser nøje på skriften.',
  'Postbud Pia kommer forbi med dagens post. Hun griner: "Jeg skriver aldrig breve. Jeg bærer dem bare."',
  'Morfar Finn sidder i hjørnet med en krimi. Han nikker mod fyrtårnet: "Der går jeg hver aften."',
  'Du lugter forsigtigt til papiret. Der er en duft, du kender …',
  'Bibliotekets lampe blinker. Udenfor begynder solen at gå ned over havet.',
  'Du finder den bog, sedlen faldt ud af, og læser titlen på ryggen.']},
{id:'hotel',titel:'Spøgelset på Hotel Søblik',sted:'3. sal på et gammelt badehotel',
 intro:'Gæsterne på Hotel Søblik klager: Hver nat lyder der skridt og dunk på 3. sal, men gangen er tom. Nogle hvisker om et spøgelse. Du tror ikke på spøgelser. Du tror på beviser.',

// ---------- Gemt fremgang ----------
let P;
function load(){try{P=JSON.parse(localStorage.getItem(LS))||{}}catch(e){P={}}
  P.sager=P.sager||{};P.set=P.set||{dansk:[],eng:[]};P.rigtige=P.rigtige||0;P.spm=P.spm||0;P.gange=P.gange||{};P.dage=P.dage||[];}
function save(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function noterDag(){const d=new Date().toISOString().slice(0,10);if(!P.dage.includes(d)){P.dage.push(d);save()}}

function pickItem(fag){
  const bank=fag==='dansk'?DANSK:ENGELSK;let seen=P.set[fag];
  let kand=bank.map((_,i)=>i).filter(i=>!seen.includes(i));
  if(!kand.length){seen=P.set[fag]=[];kand=bank.map((_,i)=>i)}
  const i=pick(kand);seen.push(i);save();
  const it=bank[i];return{type:'mc',q:it.q,t:it.t,svar:it.o[0],opts:shuffle(it.o),f:it.f};
}
function lavMat(){const it=pick(MAT)();
  if(it.mc)return{type:'mc',q:it.q,svar:it.o[0],opts:shuffle(it.o),f:it.f};
  return{type:it.type||'tal',q:it.q,svar:String(it.s),f:it.f};}
function lavSpm(fag){return fag==='mat'?lavMat():pickItem(fag)}

  app.innerHTML=r();bind();gemS();
}

function gemS(){try{if(S.screen==='q'||S.screen==='deduk'){const g=Object.assign({},S,{sag:S.sag?S.sag.id:undefined});localStorage.setItem(LS+'_s',JSON.stringify(g))}else localStorage.removeItem(LS+'_s')}catch(e){}}
function genoptag(){try{const g=JSON.parse(localStorage.getItem(LS+'_s')||'null');if(!g||!g.screen)return;if(g.sag){g.sag=SAGER.find(s=>s.id===g.sag);if(!g.sag)return}if(g.mode==='sag'&&!g.sag)return;S=g}catch(e){}}
function stjerner(n){return '★'.repeat(n)+'☆'.repeat(3-n)}

function rHjem(){
  const done=Object.values(P.sager).filter(x=>x.done).length;
  const st=Object.values(P.sager).reduce((a,x)=>a+(x.stars||0),0);
  return `
  <header class="brand"><h1>Detektiv Emilie</h1><small>Detektivbureauet · 4. klasse</small></header>
  <div class="stats"><div class="stat">Opklarede sager <b>${done}/${SAGER.length}</b></div><div class="stat">Stjerner <b>${st}</b></div><div class="stat">Dage på sagen <b>${P.dage.length}</b></div></div>
  <section class="sektion"><div class="sektion-h"><h2>Sagsmapper</h2><span>8 opgaver pr. sag</span></div>
  ${SAGER.map((s,i)=>{const p=P.sager[s.id]||{};const kl=p.done?'done':(p.igang?'igang':'');
    const status=p.done?`<span class="stjerner">${stjerner(p.stars)}</span>`:(p.igang?'I gang':'Ny sag');
    return `<button class="mappe ${kl}" data-sag="${s.id}" data-nr="Sag nr. ${i+1}"><h3>${esc(s.titel)}</h3><div class="sted">${esc(s.sted)}</div><div class="status">${status}</div></button>`}).join('')}
  </section>

   <button class="gangeknap" data-go="gangevalg"><div><b>Gangejagten</b><small>Vælg en tabel og svar så hurtigt du kan</small></div><span>→</span></button>
  </section>
  <section class="sektion"><div class="sektion-h"><h2>Træning</h2><span>10 opgaver i ét fag</span></div>
   <div class="fagrad">${Object.entries(FAG).map(([k,f])=>`<button class="fagknap" style="--f:${f.farve}" data-traen="${k}">${f.navn}<small>10 opgaver</small></button>`).join('')}</div>
  </section>`;
}

   <div class="rad"><button class="knap lys" data-go="hjem">Hjem</button><button class="knap brass" data-traen="${S.fag}">Igen</button></div></div>`;}

// ---------- Opgave-flow ----------
function startSag(id){const sag=SAGER.find(s=>s.id===id);noterDag();
  P.sager[id]=P.sager[id]||{};P.sager[id].igang=true;save();
  const fag=shuffle(['mat','mat','mat','dansk','dansk','dansk','eng','eng']);
  S={screen:'q',mode:'sag',sag,qs:fag,i:0,fejl:0,forsog:0};nyt();}
function startTraen(fag){noterDag();S={screen:'q',mode:'traen',fag,qs:Array(10).fill(fag),i:0,fejl:0,forsog:0};nyt();}
function nyt(){S.fag=S.qs[S.i];S.item=lavSpm(S.fag);S.forsog=0;S.screen='q';render();const inp=document.getElementById('ans');if(inp)inp.focus();}

function norm(v,type){v=String(v).trim().toLowerCase().replace(/\s+/g,'');
  if(type==='tid'){const m=v.match(/^(\d{1,2})[.:,]?(\d{2})$/);return m?tid(+m[1],+m[2]):v}
  return v.replace(/\./g,'').replace(',','.')}
function tjek(svar){const it=S.item;const rigtigt=norm(svar,it.type)===norm(it.svar,it.type);
  P.spm++;if(rigtigt&&S.forsog===0)P.rigtige++;save();
  if(rigtigt){vis(true,svar);return}
  S.forsog++;if(S.forsog===1){S.fejl++;visPrøvIgen(svar)}else vis(false,svar);}

function visPrøvIgen(svar){const fb=document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.opt===svar){b.classList.add('bad');b.disabled=true}});
  const inp=document.getElementById('ans');if(inp){inp.classList.add('bad');inp.select()}
  fb.innerHTML=`<div class="fb bad"><div class="t">Ikke helt. Prøv én gang til!</div></div>`;}

function vis(rigtigt,svar){const it=S.item,fb=document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.opt===it.svar)b.classList.add('ok');else if(b.dataset.opt===svar&&!rigtigt)b.classList.add('bad')});
  const inp=document.getElementById('ans');if(inp){inp.disabled=true;inp.classList.add(rigtigt?'ok':'bad');document.querySelector('#ansform button').disabled=true}
  let h='';
  if(rigtigt)h+=`<div class="t">${pick(['Rigtigt!','Flot!','Præcis!','Godt set, detektiv!','Korrekt!'])}</div>`;
  else h+=`<div class="t">Det rigtige svar er: ${esc(it.svar)}</div>`;
  if(it.f)h+=`<div class="fork">${esc(it.f)}</div>`;
  const sidste=S.i===S.qs.length-1;
  if(S.mode==='sag'){h+=`<p class="hist">${esc(S.sag.hist[S.i])}</p>`;
    const k=SPOR_VED.indexOf(S.i);if(k>=0)h+=`<div class="spor"><span class="lup">Ledetråd ${k+1}</span><span>${esc(S.sag.spor[k].tekst)}</span></div>`;}
  h+=`<div class="rad"><button class="knap brass" id="naeste">${sidste?(S.mode==='sag'?'Afslør den skyldige →':'Se resultat →'):'Næste →'}</button></div>`;
  fb.innerHTML=`<div class="fb ${rigtigt?'ok':'bad'}">${h}</div>`;
  const b=document.getElementById('naeste');b.focus();b.scrollIntoView({block:'nearest',behavior:'smooth'});}

function naeste(){S.i++;
  if(S.i<S.qs.length){nyt();return}
  if(S.mode==='sag'){S.screen='deduk';S.ude=[];render()}else{S.screen='traenslut';render()}}

function anklag(i){const s=S.sag,m=s.mist[i],fb=document.getElementById('fb');
  if(m.navn===s.skyldig){const stars=S.fejl<=1?3:(S.fejl<=3?2:1);const p=P.sager[s.id];
    p.done=true;p.igang=false;p.stars=Math.max(p.stars||0,stars);save();S.screen='opklaret';render();konfetti();return}
  const sp=s.spor.find(x=>m.t[x.n]!==x.v);S.ude.push(i);
  render();document.getElementById('fb').innerHTML=`<div class="fb bad"><div class="t">Nej, ${esc(m.navn)} er ikke den skyldige.</div>
   <div class="fork">${esc(s.labels[sp.n])}: ${esc(m.t[sp.n])}. Men ledetråden siger: "${esc(sp.tekst)}"</div></div>`;
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});}

const TABELLER=[2,3,4,5,6,7,8,9,10];
function rGangeValg(){return `

function rGange(){const [a,b]=S.qs[S.i];return `
  <header class="top"><button class="lnk" data-go="gangevalg">← Afbryd</button><div class="ur"><span class="tid" id="tid">${fmt(Date.now()-S.start)}</span></div></header>
  <div class="side gspil" style="background-image:none">
   <div class="ur"><span>${S.tab==='bland'?'Blandet':S.tab+'-tabellen'}</span><span>${S.i+1} / ${S.qs.length} · ${S.fejl} fejl</span></div>
   <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
   <div class="gq" id="gq">${a} · ${b} = ?</div>
   <div class="gsvar" id="gsvar">${S.inp||'&nbsp;'}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button data-d="slet">⌫</button><button data-d="0">0</button><button data-d="ok" class="ok">OK</button></div>
  </div>`;}
function gTast(d){if(S.laast)return;
  if(d==='slet')S.inp=S.inp.slice(0,-1);else if(d==='ok')return gTjek();else if(S.inp.length<3)S.inp+=d;
  document.getElementById('gsvar').innerHTML=S.inp||'&nbsp;';
  if(S.inp.length&&+S.inp===S.qs[S.i][0]*S.qs[S.i][1])gTjek();}
function gTjek(){if(!S.inp)return;const [a,b]=S.qs[S.i];const ok=+S.inp===a*b;const gq=document.getElementById('gq');
  S.laast=true;
  if(ok){gq.textContent=`${a} · ${b} = ${a*b}`;gq.classList.add('ok');setTimeout(()=>{S.i++;S.inp='';S.laast=false;if(S.i>=S.qs.length)gSlut();else render()},350)}
  else{S.fejl++;gq.textContent=`${a} · ${b} = ${a*b}`;gq.classList.add('bad');document.getElementById('gsvar').textContent=S.inp+' ✗';
    setTimeout(()=>{S.i++;S.inp='';S.laast=false;if(S.i>=S.qs.length)gSlut();else render()},1400)}}
function gSlut(){clearInterval(gTimer);const ms=Date.now()-S.start+S.fejl*3000;const b=P.gange[S.tab];
  S.ms=ms;S.ny=!b||ms<b.ms;if(S.ny)P.gange[S.tab]={ms,fejl:S.fejl};save();S.screen='gangeslut';render();if(S.ny&&S.fejl===0)konfetti();}
function rGangeSlut(){return `
  <div class="opk" style="border-top:6px solid var(--gange)"><h2>${S.tab==='bland'?'Blandet 2–10':S.tab+'-tabellen'}</h2>
   <div class="score" style="color:var(--gange)">${fmt(S.ms)}</div>
   <p>${S.fejl===0?'Ingen fejl!':`${S.fejl} fejl (hver fejl koster 3 sekunder).`} ${S.ny?'Ny rekord!':`Din rekord er ${fmt(P.gange[S.tab].ms)}.`}</p>
   <div class="rad"><button class="knap lys" data-go="gangevalg">Vælg tabel</button><button class="knap brass" style="background:var(--gange)" data-tab="${S.tab}">Igen</button></div></div>`;}

// ---------- Konfetti ----------
function konfetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='konf';document.body.appendChild(c);const x=c.getContext('2d');
  c.width=innerWidth;c.height=innerHeight;const farver=['#a8771f','#b8382f','#1f5fa8','#2f8a4a','#7a3fa0','#e0b24a'];
  const p=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:4+Math.random()*5,f:pick(farver),a:Math.random()*6}));
  const t0=performance.now();(function frame(t){x.clearRect(0,0,c.width,c.height);
    p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.a+=.1;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.f;x.fillRect(-q.r/2,-q.r/2,q.r,q.r*.6);x.restore()});
    if(t-t0<2800)requestAnimationFrame(frame);else c.remove()})(t0);}

// ---------- Events ----------
function bind(){
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{clearInterval(gTimer);const g=b.dataset.go;if(g==='hjem')go({screen:'hjem'});else if(g==='gangevalg')go({screen:'gangevalg'})});
  app.querySelectorAll('[data-sag]').forEach(b=>b.onclick=()=>go({screen:'intro',sag:SAGER.find(s=>s.id===b.dataset.sag)}));
  app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startSag(b.dataset.start));
  app.querySelectorAll('[data-traen]').forEach(b=>b.onclick=()=>startTraen(b.dataset.traen));
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>startGange(b.dataset.tab));
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>gTast(b.dataset.d));
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>tjek(b.dataset.opt));
  app.querySelectorAll('[data-mist]').forEach(b=>b.onclick=()=>anklag(+b.dataset.mist));
  const f=document.getElementById('ansform');if(f)f.onsubmit=e=>{e.preventDefault();const v=document.getElementById('ans').value;if(v.trim())tjek(v)};
}
app.addEventListener('click',e=>{if(e.target.id==='naeste')naeste()});
document.addEventListener('keydown',e=>{if(S.screen!=='gange')return;if(/^[0-9]$/.test(e.key))gTast(e.key);else if(e.key==='Backspace')gTast('slet');else if(e.key==='Enter')gTast('ok')});

load();genoptag();render();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
